<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>서바이벌오션 (Survival Ocean)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #041526;
        overflow: hidden;
        touch-action: none;
      }
      #game-container {
        width: 100%;
        height: 100%;
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #game-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
